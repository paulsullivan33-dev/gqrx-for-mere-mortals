site_name: GQRX for Mere Mortals
site_description: Plain-language listening with the GQRX software-defined radio receiver. The window and its dials, a receiver configured and run from a recording when there is no dongle, the everyday listening workflows, audio and I/Q recordings you can replay, bookmarks in a plain-text file, and a remote control you can script.
site_url: https://paulsullivan33-dev.github.io/gqrx-for-mere-mortals/

